name: CI

# Runs on pull requests, and is reused by release.yml on pushes to master.
# Only release runs upload short-lived artifacts for the publish job.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # Pinned so builds are reproducible. Bump deliberately.
  ODIN_RELEASE: dev-2026-09

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            libfile: libflushtools.so
            archive: flushtools-linux-x86_64.zip
            library_archive: flushtools-linux-x86_64-library-only.zip
          - os: windows-latest
            platform: windows-x86_64
            libfile: flushtools.dll
            archive: flushtools-windows-x86_64.zip
            library_archive: flushtools-windows-x86_64-library-only.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ github.token }}

      - name: Odin version
        run: odin version

      - name: Odin unit tests
        run: odin test tests -vet -strict-style

      - name: Build shared library
        run: |
          mkdir -p build
          odin build src -build-mode:dll -out:build/${{ matrix.libfile }} -o:speed -vet -strict-style

      - name: Verify build outputs
        run: |
          ls -la build
          test -f "build/${{ matrix.libfile }}"
          if [ "$RUNNER_OS" = "Windows" ]; then test -f build/flushtools.lib; fi

      - name: C ABI test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/c/abi_test.c \
            -Lbuild -lflushtools -lm -o build/abi_test
          LD_LIBRARY_PATH=build DYLD_LIBRARY_PATH=build ./build/abi_test

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: C ABI test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /W4 /Iinclude tests\c\abi_test.c build\flushtools.lib /Fe:build\abi_test.exe /Fo:build\
          if errorlevel 1 exit /b 1
          build\abi_test.exe

      - name: Build and run C example (Linux)
        if: runner.os == 'Linux'
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude examples/c/main.c \
            -Lbuild -lflushtools -Wl,-rpath,'$ORIGIN' -o build/c_example
          LD_LIBRARY_PATH=build ./build/c_example

      - name: Build and run C example (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /W4 /Iinclude examples\c\main.c build\flushtools.lib /Fe:build\c_example.exe /Fo:build\
          if errorlevel 1 exit /b 1
          set PATH=%CD%\build;%PATH%
          build\c_example.exe

      # Full bundle: header + shared library (and Windows import library).
      # Library-only: shared library (and Windows import library), no header.
      - name: Package (Linux archives)
        if: runner.os != 'Windows'
        run: |
          zip -j "${{ matrix.archive }}" include/flushtools.h "build/${{ matrix.libfile }}"
          zip -j "${{ matrix.library_archive }}" "build/${{ matrix.libfile }}"

      - name: Package (Windows archives)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path include\flushtools.h, build\flushtools.dll, build\flushtools.lib -DestinationPath "${{ matrix.archive }}"
          Compress-Archive -Path build\flushtools.dll, build\flushtools.lib -DestinationPath "${{ matrix.library_archive }}"

      - name: Verify and list Linux archives
        if: runner.os != 'Windows'
        run: |
          unzip -t "${{ matrix.archive }}"
          unzip -t "${{ matrix.library_archive }}"
          unzip -l "${{ matrix.archive }}"
          unzip -l "${{ matrix.library_archive }}"

      - name: Verify and list Windows archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($archivePath in @("${{ matrix.archive }}", "${{ matrix.library_archive }}")) {
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archivePath))
            try {
              Write-Host $archivePath
              $zip.Entries | ForEach-Object { Write-Host $_.FullName }
            } finally {
              $zip.Dispose()
            }
          }

      # Artifacts are only a handoff to the release job. Skip PR/manual runs
      # and expire the handoff quickly; published release assets are separate.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dist-${{ matrix.platform }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.library_archive }}
          if-no-files-found: error
          retention-days: 1

  sanitizers:
    name: sanitizers (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ github.token }}

      # Sanitizer runtimes can crash on kernels with high ASLR entropy.
      - name: Lower ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Show toolchain
        run: |
          odin version
          clang --version

      # asan: AddressSanitizer + LeakSanitizer + UBSan (Odin lib built with
      #       -sanitize:address; C tests built with clang -fsanitize)
      # tsan: ThreadSanitizer
      - name: Run ${{ matrix.mode }}
        run: bash scripts/sanitize.sh ${{ matrix.mode }}

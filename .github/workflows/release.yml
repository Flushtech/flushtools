name: Release

# On every push to the default branch:
#   1. Release Please opens/updates a release PR, or creates a draft release
#      when a release PR is merged.
#   2. The full CI matrix builds and tests the release commit.
#   3. If a release was created and CI passed, this job attaches and verifies
#      every package before publishing the release.
#
# Keep build + upload in this workflow: the release is created with a PAT, but
# the upload job uses GITHUB_TOKEN and does not depend on a separate release
# event workflow.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets['releae_please_PAT'] }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Attach binaries and publish release
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Assets:
      #   flushtools-<tag>-<platform>.zip                 full bundle
      #   flushtools-<tag>-<platform>-library-only.zip    library + Windows import lib
      #   flushtools-<tag>-header-only.zip                public header only
      #   SHA256SUMS.txt                                  checksums for every zip
      - name: Upload and publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          HEADER: ${{ github.workspace }}/include/flushtools.h
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Never attempt to mutate a published (and potentially immutable)
          # release. Release Please must create this release as a draft.
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $TAG is not a draft; refusing to upload assets."
            exit 1
          fi

          zip -j flushtools-header-only.zip "$HEADER"
          archives=(flushtools-*.zip)
          if [[ "${#archives[@]}" -ne 5 ]]; then
            echo "::error::Expected five ZIP packages, found ${#archives[@]}."
            printf '%s\\n' "${archives[@]}"
            exit 1
          fi

          for archive in "${archives[@]}"; do
            unzip -t "$archive"
            mv "$archive" "${archive/flushtools-/flushtools-${TAG}-}"
          done

          archives=(flushtools-*.zip)
          sha256sum "${archives[@]}" > SHA256SUMS.txt
          ls -lh "${archives[@]}" SHA256SUMS.txt

          # Upload everything while the release is still editable.
          gh release upload "$TAG" "${archives[@]}" SHA256SUMS.txt

          # Confirm all six expected assets are attached before making the
          # release immutable by publishing it.
          asset_count="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          if [[ "$asset_count" -ne 6 ]]; then
            echo "::error::Expected six release assets, found $asset_count."
            exit 1
          fi

          gh release edit "$TAG" --draft=false

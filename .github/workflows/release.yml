name: Release

# On every push to the default branch:
#   1. release-please opens/updates a release PR (or, when that PR was just
#      merged, creates the tag + GitHub release).
#   2. The full CI matrix runs against the pushed commit.
#   3. If a release was created and CI passed, the built libraries are
#      attached to that release.
#
# Build + upload live in this one workflow on purpose: releases created with
# the default GITHUB_TOKEN do not trigger other workflows (e.g. on: release).
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Attach binaries to release
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Assets:
      #   flushtools-<tag>-<platform>.zip   header + that platform's library only
      #   flushtools.h                      the header on its own
      #   SHA256SUMS.txt
      - name: Upload release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          HEADER: ${{ github.workspace }}/include/flushtools.h
        run: |
          set -euo pipefail
          for f in flushtools-*.zip; do
            mv "$f" "${f/flushtools-/flushtools-${TAG}-}"
          done
          cp "$HEADER" flushtools.h
          sha256sum flushtools-*.zip flushtools.h > SHA256SUMS.txt
          ls -la
          gh release upload "$TAG" flushtools-*.zip flushtools.h SHA256SUMS.txt --clobber
